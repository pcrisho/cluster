name: cluster-perf

# Infrastructure of the load-test box: its own Postgres, Redis and storage, so the dev stack is never touched.
# stack.sh sets the limits through PERF_* (profile `min` or `rec`); every service is pinned to the same cores
# (PERF_CPUSET) as the API, collab and web, so they compete for the CPU like they would on one small server.
# Data lives in named volumes: `stack.sh stop` keeps it, `db.sh teardown` removes it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: perf-postgres
    command: ["postgres", "-c", "shared_buffers=${PERF_PG_SHARED:-128MB}", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: cluster
      POSTGRES_PASSWORD: cluster
    ports:
      - "55432:5432"
    volumes:
      - perf-postgres:/var/lib/postgresql/data
    cpuset: ${PERF_CPUSET:-2}
    mem_limit: ${PERF_PG_MEM:-512m}
    memswap_limit: ${PERF_PG_MEM:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluster"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: perf-redis
    ports:
      - "56379:6379"
    volumes:
      - perf-redis:/data
    cpuset: ${PERF_CPUSET:-2}
    mem_limit: ${PERF_REDIS_MEM:-64m}
    memswap_limit: ${PERF_REDIS_MEM:-64m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: perf-storage
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      STORAGE_ACCESS_KEY: perf-storage
      STORAGE_SECRET_KEY: perf-storage-secret
    ports:
      - "59000:8333"
    volumes:
      - perf-storage:/data
      - ../../docker/storage/start.sh:/start.sh:ro
    cpuset: ${PERF_CPUSET:-2}
    mem_limit: ${PERF_STORAGE_MEM:-256m}
    memswap_limit: ${PERF_STORAGE_MEM:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|403|404)'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  perf-postgres:
  perf-redis:
  perf-storage:

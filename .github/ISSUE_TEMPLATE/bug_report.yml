name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not use this form for security issues: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag (for example v0.2.0) or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (self-hosted)
        - Local development (pnpm dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - KNOW
        - GROW
        - CONNECT
        - Core / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant API, web or browser console output. Remove secrets and personal data.
      render: shell

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: cluster-postgres
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cluster}
      POSTGRES_USER: ${POSTGRES_USER:-cluster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cluster} -d ${POSTGRES_DB:-cluster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ephemeral counters only (rate limits): nothing in it weakens security if lost, so no AOF.
  # Private network only, no published port; the password is required.
  redis:
    image: redis:7.4-alpine
    container_name: cluster-redis
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: cluster-storage
    logging: *logging
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    # Not published: the browser never talks to storage, the API serves /files.
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-cluster-storage}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-cluster-storage-secret}
    volumes:
      - storage-data:/data
      - ./docker/storage/start.sh:/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|403|404)'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: the only container that holds the owner's credentials. Creates/updates the app and system roles,
  # then applies migrations; the API starts after it and never sees the owner.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: cluster-migrate
    logging: *logging
    restart: "no"
    command: ["sh", "-c", "node dist/db-roles.js && npx prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://cluster_app:${CLUSTER_APP_PASSWORD:?set CLUSTER_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cluster}
      DATABASE_SYSTEM_URL: postgresql://cluster_system:${CLUSTER_SYSTEM_PASSWORD:?set CLUSTER_SYSTEM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cluster}
      DATABASE_OWNER_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@postgres:5432/${POSTGRES_DB:-cluster}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: cluster-api
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    # Listed one by one, not env_file: the API must not receive POSTGRES_PASSWORD or DATABASE_OWNER_URL
    # (the owner is for the migrate service). Inside the compose network services are reached by name.
    environment:
      NODE_ENV: production
      # cluster_app (row-level security applies) for requests; cluster_system (bypasses it, DML only) for the system client.
      DATABASE_URL: postgresql://cluster_app:${CLUSTER_APP_PASSWORD:?set CLUSTER_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cluster}
      DATABASE_SYSTEM_URL: postgresql://cluster_system:${CLUSTER_SYSTEM_PASSWORD:?set CLUSTER_SYSTEM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cluster}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_HOST: storage
      STORAGE_PORT: "8333"
      STORAGE_USE_SSL: "false"
      STORAGE_BUCKET: ${STORAGE_BUCKET:-cluster}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-cluster-storage}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-cluster-storage-secret}
      # The API tells collab about access changes over the compose network (best effort).
      COLLAB_URL: http://collab:3002
      COLLAB_INTERNAL_SECRET: ${COLLAB_INTERNAL_SECRET:?set COLLAB_INTERNAL_SECRET in .env (openssl rand -hex 32)}
      COLLAB_MAX_DOC_BYTES: ${COLLAB_MAX_DOC_BYTES:-10485760}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_LOGIN_IP_FAILURES: ${AUTH_LOGIN_IP_FAILURES:-}
      AUTH_EVENTS_RETENTION_DAYS: ${AUTH_EVENTS_RETENTION_DAYS:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # file-url.ts builds the browser URLs of stored files from it.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Cluster <no-reply@cluster.local>}
      MAIL_INVITES_PER_MINUTE: ${MAIL_INVITES_PER_MINUTE:-60}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_ORG_NAME: ${SUPERADMIN_ORG_NAME:-Default}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Lesson video uploads and playback need more than 512M (API_MEMORY_LIMIT in .env.example).
          memory: "${API_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "0.25"
          memory: "128M"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:3002}
    container_name: cluster-web
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    # Listed, not env_file: the web must not receive POSTGRES_PASSWORD or the owner URL. NEXT_PUBLIC_* are baked
    # in at build time (the Dockerfile sets them from the build args).
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001/api/v1}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    container_name: cluster-collab
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COLLAB_PORT:-3002}:3002"
    # Listed one by one, not env_file: collab needs neither the database nor the JWT secret.
    environment:
      COLLAB_PORT: "3002"
      COLLAB_INTERNAL_SECRET: ${COLLAB_INTERNAL_SECRET:?set COLLAB_INTERNAL_SECRET in .env (openssl rand -hex 32)}
      COLLAB_ALLOWED_ORIGINS: ${COLLAB_ALLOWED_ORIGINS:-http://localhost:3000}
      COLLAB_API_URL: http://api:3001/api/v1
      COLLAB_MAX_DOC_BYTES: ${COLLAB_MAX_DOC_BYTES:-10485760}
    depends_on:
      api:
        condition: service_healthy
    # On stop it saves the open documents before exiting.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # TLS proxy, off by default: `docker compose --profile proxy up -d` (see README, "TLS and the proxy").
  # A client with its own proxy leaves the profile off and follows the checklist there.
  caddy:
    profiles: ["proxy"]
    image: caddy:2.10-alpine
    container_name: cluster-caddy
    logging: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLUSTER_DOMAIN: ${CLUSTER_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      collab:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  storage-data:
  caddy-data:
  caddy-config:
